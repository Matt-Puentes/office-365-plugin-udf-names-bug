<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet"
        href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" />
        <h1 class="ms-font-su">Sample Project for Reproducing Bugs</h1>
    </header>
    <div class="ms-bgColor-neutralLighter">
        <p>Please reference provided reproduction steps for more information</p>
    </div>
    <div id="app-body" class="ms-bgColor-neutralLighter" style="display: none; flex-direction: column; padding: 16px; gap: 20px;">
        <section>
            <p class="ms-font-m" style="margin: 0 0 8px 0; font-weight: 600;">
                Step 1: Insert Named objects into the sheet
            </p>
            <p class="ms-font-s" style="margin: 0 0 8px 0;">
                Inserts <code>udf_name</code> (=add(1,2)) and <code>sum_name</code> (=SUM(1,2)) on the active sheet.
            </p>
            <button id="insert-names-btn" type="button" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">Insert Names</span>
            </button>
        </section>
        <section>
            <p class="ms-font-m" style="margin: 0 0 8px 0; font-weight: 600;">
                Step 2: Attempt to read values from sheet
            </p>
            <button id="read-names-btn" type="button" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">Read Named Values</span>
            </button>
            <p id="read-result" style="margin: 8px 0 0 0; word-break: break-all; white-space: pre-wrap;"></p>
        </section>
    </div>
</body>

</html>
